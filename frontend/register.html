<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Thành Viên - FlowerShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- ==================== HEADER NAVBAR ==================== -->
  <header class="site-header sticky-top bg-white border-bottom shadow-sm">
    <div class="container py-2">
      <div class="d-flex align-items-center justify-content-between">
        <a href="/index.html" class="brand-logo text-decoration-none d-flex align-items-center">
          <i class="fas fa-spa brand-icon me-2 text-danger fs-3"></i>
          <div>
            <span class="brand-name font-serif fw-bold fs-4 text-danger">FlowerShop</span>
            <span class="d-none d-sm-block brand-tagline text-muted small" style="font-size: 0.68rem;">TIỆM HOA TƯƠI TRỰC TUYẾN</span>
          </div>
        </a>

        <div class="d-flex align-items-center gap-3">
          <a href="/index.html" class="nav-link text-muted small fw-bold">
            <i class="fas fa-home me-1"></i>Trang chủ
          </a>
          <a href="/products.html" class="nav-link text-muted small fw-bold">
            <i class="fas fa-store me-1"></i>Cửa hàng
          </a>
          <div id="user-nav-container"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== REGISTER FORM ==================== -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle rounded-circle mb-3" style="width: 70px; height: 70px;">
              <i class="fas fa-user-plus text-danger fs-2"></i>
            </div>
            <h3 class="font-serif fw-bold text-dark mb-1">Tạo Tài Khoản Thành Viên</h3>
            <p class="text-muted small">Đăng ký thành viên để lưu sổ địa chỉ, nhận mã giảm giá và theo dõi đơn hoa dễ dàng.</p>
          </div>

          <form id="register-form" onsubmit="handleRegister(event)">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold text-dark">Họ và tên của bạn *</label>
                <input type="text" class="form-control rounded-pill bg-light" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold text-dark">Tên đăng nhập (Username) *</label>
                <input type="text" class="form-control rounded-pill bg-light" id="username" placeholder="Ví dụ: nguyenvana" required>
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold text-dark">Địa chỉ Email *</label>
                <input type="email" class="form-control rounded-pill bg-light" id="email" placeholder="name@example.com" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold text-dark">Mật khẩu *</label>
                <input type="password" class="form-control rounded-pill bg-light" id="password" placeholder="Tối thiểu 6 ký tự" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold text-dark">Nhập lại mật khẩu *</label>
                <input type="password" class="form-control rounded-pill bg-light" id="confirmPassword" placeholder="Khớp mật khẩu trên" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold text-dark">Số điện thoại nhận hoa</label>
                <input type="tel" class="form-control rounded-pill bg-light" id="phone" placeholder="0912 345 678">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold text-dark">Tỉnh / Thành phố</label>
                <input type="text" class="form-control rounded-pill bg-light" id="city" value="Hà Nội">
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold text-dark">Địa chỉ giao hàng mặc định</label>
                <input type="text" class="form-control rounded-pill bg-light" id="address" placeholder="Số nhà, tên đường, phường/xã...">
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-danger w-100 rounded-pill py-2 fw-bold shadow-sm" id="btn-submit">
                  <i class="fas fa-check-circle me-2"></i>Đăng Ký Thành Viên Ngay
                </button>
              </div>
            </div>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">Bạn đã có tài khoản rồi? </span>
            <a href="/login.html" class="fw-bold text-danger text-decoration-none small">Đăng nhập tại đây</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const phone = document.getElementById('phone').value.trim();
      const city = document.getElementById('city').value.trim();
      const address = document.getElementById('address').value.trim();

      if (password !== confirmPassword) {
        showToast('Mật khẩu nhập lại không khớp!', 'warning');
        return;
      }

      if (password.length < 6) {
        showToast('Mật khẩu phải có ít nhất 6 ký tự!', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Đang đăng ký tài khoản...';

      try {
        const res = await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            username,
            email,
            password,
            full_name: fullName,
            phone,
            city,
            address
          })
        });

        if (res.success && res.token && res.user) {
          setAuthSession(res.token, res.user);
          showToast(res.message || 'Đăng ký thành công!');

          setTimeout(() => {
            window.location.href = '/profile.html';
          }, 800);
        } else {
          showToast(res.error || 'Đăng ký không thành công!', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Đăng Ký Thành Viên Ngay';
        }
      } catch (err) {
        showToast('Lỗi kết nối máy chủ Cloudflare!', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle me-2"></i>Đăng Ký Thành Viên Ngay';
      }
    }
  </script>
</body>
</html>
