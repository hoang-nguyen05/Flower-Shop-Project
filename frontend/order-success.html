<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Hàng Thành Công - FlowerShop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ==================== HEADER NAVBAR ==================== -->
  <nav class="navbar navbar-expand-lg navbar-floral sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="fas fa-seedling"></i>
        <span>FlowerShop</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="/" class="btn btn-outline-danger btn-sm rounded-pill">
          <i class="fas fa-home me-1"></i>Trang chủ
        </a>
        <div id="user-nav-container" class="ms-1"></div>
      </div>
    </div>
  </nav>

  <!-- ==================== SUCCESS CONTENT ==================== -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8" id="order-success-container">
        <div class="text-center py-5">
          <div class="spinner-border text-danger" role="status"></div>
          <div class="mt-2 text-muted">Đang tải thông tin đơn hàng...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderCode = urlParams.get('code');

    function getOrderStatusBadge(status) {
      switch (status) {
        case 'pending': return '<span class="badge bg-warning text-dark"><i class="fas fa-clock me-1"></i>Chờ xử lý</span>';
        case 'approved': return '<span class="badge bg-info text-dark"><i class="fas fa-check me-1"></i>Đã duyệt (Đang cắm hoa)</span>';
        case 'shipping': return '<span class="badge bg-primary"><i class="fas fa-truck me-1"></i>Đang giao hoa</span>';
        case 'completed': return '<span class="badge bg-success"><i class="fas fa-check-double me-1"></i>Hoàn thành</span>';
        case 'cancelled': return '<span class="badge bg-secondary"><i class="fas fa-times me-1"></i>Đã hủy</span>';
        default: return `<span class="badge bg-light text-dark">${status}</span>`;
      }
    }

    async function loadSuccessOrder() {
      const container = document.getElementById('order-success-container');
      if (!orderCode) {
        container.innerHTML = '<div class="alert alert-danger text-center">Không tìm thấy mã đơn hàng. <a href="/">Về trang chủ</a></div>';
        return;
      }

      const res = await apiRequest(`/orders/${orderCode}`);
      if (!res.success || !res.order) {
        container.innerHTML = '<div class="alert alert-danger text-center">Không tìm thấy thông tin đơn hàng. <a href="/">Về trang chủ</a></div>';
        return;
      }

      const order = res.order;
      const isVietQr = order.payment_method === 'vietqr' || order.payment_method === 'bank_transfer';
      const isMomo = order.payment_method === 'momo';
      const isCod = order.payment_method === 'cod';
      const isPaid = order.payment_status === 'paid';

      let paymentBadge = '';
      if (isCod) {
        paymentBadge = isPaid 
          ? '<span class="badge bg-success"><i class="fas fa-check me-1"></i>Đã thu tiền COD</span>' 
          : '<span class="badge bg-secondary text-white"><i class="fas fa-truck me-1"></i>COD (Thanh toán khi nhận hoa)</span>';
      } else {
        paymentBadge = isPaid 
          ? '<span class="badge bg-success"><i class="fas fa-check me-1"></i>Đã thanh toán</span>' 
          : '<span class="badge bg-warning text-dark"><i class="fas fa-hourglass-half me-1"></i>Chờ chuyển khoản (Giữ hoa 2H)</span>';
      }

      let paymentSection = '';
      const isPaid = order.payment_status === 'paid';

      if (isPaid) {
        paymentSection = `
          <div class="alert alert-success border-0 rounded-4 my-4 p-4 text-center shadow-sm">
            <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-3" style="width: 50px; height: 50px;">
              <i class="fas fa-check-double fs-4"></i>
            </div>
            <h5 class="fw-bold text-success mb-1">Đã Xác Nhận Thanh Toán Thành Công!</h5>
            <p class="mb-0 text-muted small">Cảm ơn bạn! Đơn hàng đã được thanh toán đầy đủ qua ${isVietQr ? 'VietQR' : (isMomo ? 'MoMo' : 'Chuyển khoản')}. Thợ cắm hoa đang chuẩn bị đơn để giao đúng hẹn.</p>
          </div>
        `;
      } else if (isMomo) {
        paymentSection = `
          <div class="vietqr-card my-4" style="border: 2px solid #a50064;">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
              <span class="badge px-3 py-2 rounded-pill fw-bold text-white" style="background: #a50064;">
                <i class="fas fa-wallet me-1"></i>Thanh Toán Qua Ví MoMo
              </span>
              <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-bold">
                <i class="fas fa-clock me-1"></i>Đang chờ thanh toán
              </span>
            </div>
            <h5 class="fw-bold mt-2 font-serif">Quét Mã Hoặc Chuyển Ví MoMo</h5>
            <p class="text-muted small">Đơn hàng của bạn đã được lưu và shop <strong>đang giữ hoa trong 2 giờ</strong>. Vui lòng mở Ví MoMo hoặc App Ngân hàng quét mã bên dưới:</p>
            
            <img src="${order.vietQrUrl}" alt="MoMo QR Thanh toán" class="vietqr-img shadow-sm rounded-3">

            <div class="bg-light p-3 rounded-3 text-start mt-3 small">
              <div class="d-flex justify-content-between py-1 border-bottom">
                <span class="text-muted">Ví MoMo / SĐT:</span>
                <span class="fw-bold text-danger">0362843621 <button class="btn btn-link btn-sm p-0 ms-1 text-primary" onclick="copyText('0362843621')">Sao chép</button></span>
              </div>
              <div class="d-flex justify-content-between py-1 border-bottom">
                <span class="text-muted">Chủ ví:</span>
                <span class="fw-bold">NGUYEN DAC HOANG</span>
              </div>
              <div class="d-flex justify-content-between py-1 border-bottom">
                <span class="text-muted">Số tiền:</span>
                <span class="fw-bold text-danger">${formatVND(order.total_amount)}</span>
              </div>
              <div class="d-flex justify-content-between py-1">
                <span class="text-muted">Lời nhắn:</span>
                <span class="fw-bold text-primary">THANHTOAN ${order.order_code} <button class="btn btn-link btn-sm p-0 ms-1 text-primary" onclick="copyText('THANHTOAN ${order.order_code}')">Sao chép</button></span>
              </div>
            </div>

            <!-- Nút xác nhận chuyển khoản -->
            <div class="mt-3 p-3 bg-white border rounded-3 text-center" id="payment-confirm-box">
              <div class="small text-muted mb-2"><i class="fas fa-info-circle text-primary me-1"></i>Bạn đã quét mã hoặc chuyển tiền thành công?</div>
              <button class="btn btn-outline-success btn-sm rounded-pill px-4 fw-bold" id="btn-confirm-paid" onclick="confirmCustomerPaid('${order.order_code}')">
                <i class="fas fa-check-circle me-1"></i>Tôi Đã Chuyển Khoản Xong
              </button>
            </div>

            <div class="mt-3 text-muted small">
              <i class="fas fa-headset me-1 text-danger"></i>Cần xác nhận gấp? Gọi ngay Hotline/Zalo: <a href="tel:0362843621" class="text-danger fw-bold">0362843621</a>
            </div>
          </div>
        `;
      } else if (isVietQr) {
        paymentSection = `
          <div class="vietqr-card my-4">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
              <span class="badge bg-success px-3 py-2 rounded-pill fw-bold">
                <i class="fas fa-qrcode me-1"></i>Quét Mã VietQR (MB Bank)
              </span>
              <span class="badge bg-warning text-dark px-3 py-2 rounded-pill fw-bold">
                <i class="fas fa-clock me-1"></i>Đang chờ chuyển khoản
              </span>
            </div>
            <h5 class="fw-bold mt-2 font-serif">Mã QR Thanh Toán Tự Động</h5>
            <p class="text-muted small">
              Đơn hàng đã được lưu và shop <strong>đang giữ hoa cho bạn trong vòng 2 giờ</strong>.<br>
              Mở App Ngân hàng bất kỳ (MB, Vietcombank, Techcombank, BIDV, VPBank,...) và quét mã bên dưới:
            </p>
            
            <img src="${order.vietQrUrl}" alt="VietQR Thanh toán" class="vietqr-img shadow-sm rounded-3">

            <div class="bg-light p-3 rounded-3 text-start mt-3 small">
              <div class="d-flex justify-content-between py-1 border-bottom">
                <span class="text-muted">Ngân hàng thụ hưởng:</span>
                <span class="fw-bold">MB Bank (Quân Đội)</span>
              </div>
              <div class="d-flex justify-content-between py-1 border-bottom">
                <span class="text-muted">Số tài khoản:</span>
                <span class="fw-bold text-danger">0362843621 <button class="btn btn-link btn-sm p-0 ms-1 text-primary" onclick="copyText('0362843621')">Sao chép</button></span>
              </div>
              <div class="d-flex justify-content-between py-1 border-bottom">
                <span class="text-muted">Chủ tài khoản:</span>
                <span class="fw-bold">NGUYEN DAC HOANG</span>
              </div>
              <div class="d-flex justify-content-between py-1 border-bottom">
                <span class="text-muted">Số tiền thanh toán:</span>
                <span class="fw-bold text-danger fs-6">${formatVND(order.total_amount)}</span>
              </div>
              <div class="d-flex justify-content-between py-1">
                <span class="text-muted">Nội dung chuyển:</span>
                <span class="fw-bold text-primary">THANHTOAN ${order.order_code} <button class="btn btn-link btn-sm p-0 ms-1 text-primary" onclick="copyText('THANHTOAN ${order.order_code}')">Sao chép</button></span>
              </div>
            </div>

            <!-- Nút xác nhận chuyển khoản -->
            <div class="mt-3 p-3 bg-white border rounded-3 text-center" id="payment-confirm-box">
              <div class="small text-muted mb-2"><i class="fas fa-info-circle text-primary me-1"></i>Bạn đã quét mã hoặc chuyển tiền thành công trên App Ngân hàng?</div>
              <button class="btn btn-outline-success btn-sm rounded-pill px-4 fw-bold" id="btn-confirm-paid" onclick="confirmCustomerPaid('${order.order_code}')">
                <i class="fas fa-check-circle me-1"></i>Tôi Đã Chuyển Khoản Xong
              </button>
            </div>

            <div class="mt-3 text-muted small">
              <i class="fas fa-headset me-1 text-danger"></i>Cần xác nhận đơn gấp? Gọi Hotline/Zalo: <a href="tel:0362843621" class="text-danger fw-bold">0362843621</a>
            </div>
          </div>
        `;
      } else {
        paymentSection = `
          <div class="alert alert-info rounded-4 my-4 p-3">
            <h6 class="fw-bold"><i class="fas fa-truck text-primary me-2"></i>Thanh toán khi nhận hàng (COD)</h6>
            <div class="small">Nhân viên giao hoa sẽ liên hệ số điện thoại <strong>${order.customer_phone}</strong> trước khi giao. Quý khách vui lòng chuẩn bị đúng số tiền <strong>${formatVND(order.total_amount)}</strong> khi nhận hoa.</div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center">
          <div class="mb-3">
            <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle" style="width: 80px; height: 80px;">
              <i class="fas fa-check fs-1"></i>
            </div>
          </div>
          <h2 class="font-serif fw-bold text-success mb-2">Đặt Hàng Thành Công!</h2>
          <p class="text-muted">Cảm ơn bạn đã lựa chọn hoa tươi tại <strong>FlowerShop</strong>.</p>
          
          <div class="card bg-light border-0 rounded-3 p-3 my-3">
            <div class="row g-2 text-start small">
              <div class="col-sm-6"><strong>Mã đơn hàng:</strong> <span class="badge bg-danger fs-6">${order.order_code}</span></div>
              <div class="col-sm-6"><strong>Trạng thái đơn:</strong> ${getOrderStatusBadge(order.status)}</div>
              <div class="col-sm-6"><strong>Thanh toán:</strong> ${paymentBadge}</div>
              <div class="col-sm-6"><strong>Phương thức:</strong> ${order.payment_method ? order.payment_method.toUpperCase() : 'VIETQR'}</div>
              <div class="col-sm-6"><strong>Người nhận:</strong> ${order.customer_name} (${order.customer_phone})</div>
              <div class="col-sm-6"><strong>Địa chỉ giao:</strong> ${order.shipping_address}, ${order.city}</div>
              ${order.notes ? `<div class="col-12"><strong>Lời chúc / Ghi chúc:</strong> "${order.notes}"</div>` : ''}
            </div>
          </div>

          ${paymentSection}

          <!-- Danh sách món hàng đã đặt -->
          <div class="text-start mt-4">
            <h6 class="fw-bold mb-3">Món hoa trong đơn hàng:</h6>
            <div class="d-flex flex-column gap-2 border rounded-3 p-3 mb-4">
              ${(order.items || []).map(i => `
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2">
                  <div class="d-flex align-items-center gap-2">
                    <img src="${i.image_url || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=100'}" width="40" height="40" class="rounded object-fit-cover">
                    <div>
                      <div class="fw-bold small">${i.product_name}</div>
                      <div class="text-muted small">Số lượng: ${i.quantity} x ${formatVND(i.price)}</div>
                    </div>
                  </div>
                  <div class="fw-bold text-danger small">${formatVND(i.price * i.quantity)}</div>
                </div>
              `).join('')}
              <div class="d-flex justify-content-between pt-2 fw-bold">
                <span>Tổng thanh toán:</span>
                <span class="text-danger fs-5">${formatVND(order.total_amount)}</span>
              </div>
            </div>
          </div>

          <div class="d-flex flex-wrap justify-content-center gap-3">
            <a href="/orders.html?phone=${encodeURIComponent(order.customer_phone)}" class="btn btn-outline-dark rounded-pill px-4">
              <i class="fas fa-receipt me-1"></i>Xem Lịch Sử Đơn Hàng
            </a>
            <a href="/products.html" class="btn btn-danger rounded-pill px-4 fw-bold">
              <i class="fas fa-shopping-basket me-1"></i>Tiếp Tục Mua Hoa
            </a>
          </div>
        </div>
      `;
    }

    function confirmCustomerPaid(orderCode) {
      const confirmBox = document.getElementById('payment-confirm-box');
      if (confirmBox) {
        confirmBox.innerHTML = `
          <div class="alert alert-success border-0 py-3 mb-0 rounded-3 text-start small">
            <h6 class="fw-bold text-success mb-1"><i class="fas fa-check-circle me-1"></i>Đã Ghi Nhận Yêu Cầu Đối Soát!</h6>
            <div>FlowerShop đã ghi nhận thông báo chuyển khoản của bạn cho đơn <strong>${orderCode}</strong>. Nhân viên thu ngân đang kiểm tra biến động số dư MB Bank (0362843621) và sẽ gửi thông báo xác nhận trong 5-15 phút.</div>
            <div class="mt-2 text-muted">Nếu cần giao hoa gấp hoặc gửi ảnh chụp biên lai, quý khách có thể gửi qua Zalo/Hotline: <a href="tel:0362843621" class="text-danger fw-bold">0362843621</a>.</div>
          </div>
        `;
      }
      showToast('Đã gửi thông báo xác nhận chuyển khoản cho FlowerShop!');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast(`Đã sao chép: ${text}`);
    }

    document.addEventListener('DOMContentLoaded', loadSuccessOrder);
  </script>
</body>
</html>
